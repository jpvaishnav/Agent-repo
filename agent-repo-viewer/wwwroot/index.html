<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Repo Viewer - Human View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .content {
            padding: 40px 30px;
        }

        .section {
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
            display: inline-block;
        }

        .agents-md {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .card-title {
            font-size: 1.3em;
            color: #667eea;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .card-description {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            font-size: 0.85em;
        }

        .meta-item {
            background: #e8e8f5;
            padding: 5px 10px;
            border-radius: 4px;
            color: #555;
        }

        .tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.8em;
            margin-right: 5px;
            margin-top: 5px;
        }

        .tags {
            margin-top: 10px;
        }

        .path {
            color: #999;
            font-size: 0.85em;
            font-family: monospace;
            margin-top: 10px;
            word-break: break-all;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.1em;
            color: #999;
        }

        .error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 20px;
            border-radius: 4px;
            color: #c62828;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .items-grid {
                grid-template-columns: 1fr;
            }

            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Agent Repo Viewer</h1>
            <p>Human View of Agent-Friendly Repository</p>
        </header>

        <div class="content">
            <div id="loading" class="loading">Loading repository context...</div>
            <div id="error" class="error" style="display: none;"></div>
            <div id="main" style="display: none;">
                <!-- Stats Section -->
                <div class="stats" id="stats"></div>

                <!-- Agents MD Section -->
                <div class="section" id="agentsSection" style="display: none;">
                    <h2 class="section-title">📋 Repository Context (AGENTS.md)</h2>
                    <div class="agents-md" id="agentsMdContent"></div>
                </div>

                <!-- Skills Section -->
                <div class="section" id="skillsSection" style="display: none;">
                    <h2 class="section-title">🛠️ Available Skills</h2>
                    <div class="items-grid" id="skillsGrid"></div>
                </div>

                <!-- Instructions Section -->
                <div class="section" id="instructionsSection" style="display: none;">
                    <h2 class="section-title">📚 Instructions</h2>
                    <div class="items-grid" id="instructionsGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadRepoContext() {
            try {
                const response = await fetch('/api/repo');
                if (!response.ok) throw new Error('Failed to load repo context');
                
                const data = await response.json();
                displayRepoContext(data);
            } catch (error) {
                showError(error.message);
            }
        }

        function displayRepoContext(data) {
            // Hide loading, show main
            document.getElementById('loading').style.display = 'none';
            document.getElementById('main').style.display = 'block';

            // Display stats
            displayStats(data);

            // Display AGENTS.md
            if (data.agentsMdContent) {
                document.getElementById('agentsSection').style.display = 'block';
                document.getElementById('agentsMdContent').textContent = data.agentsMdContent;
            }

            // Display Skills
            if (data.skills && data.skills.length > 0) {
                document.getElementById('skillsSection').style.display = 'block';
                const skillsGrid = document.getElementById('skillsGrid');
                skillsGrid.innerHTML = data.skills.map(skill => createSkillCard(skill)).join('');
            }

            // Display Instructions
            if (data.instructions && data.instructions.length > 0) {
                document.getElementById('instructionsSection').style.display = 'block';
                const instructionsGrid = document.getElementById('instructionsGrid');
                instructionsGrid.innerHTML = data.instructions.map(instr => createInstructionCard(instr)).join('');
            }
        }

        function displayStats(data) {
            const statsHtml = `
                <div class="stat-card">
                    <div class="stat-number">${data.skills ? data.skills.length : 0}</div>
                    <div class="stat-label">Skills</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.instructions ? data.instructions.length : 0}</div>
                    <div class="stat-label">Instructions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.agentsMdContent ? '✓' : '✗'}</div>
                    <div class="stat-label">Context File</div>
                </div>
            `;
            document.getElementById('stats').innerHTML = statsHtml;
        }

        function createSkillCard(skill) {
            const tags = skill.tags && skill.tags.length > 0 
                ? skill.tags.map(tag => `<span class="tag">${tag}</span>`).join('') 
                : '';
            
            return `
                <div class="card">
                    <div class="card-title">${skill.name}</div>
                    <div class="card-description">${skill.description}</div>
                    <div class="meta">
                        <div class="meta-item"><strong>v${skill.version}</strong></div>
                        <div class="meta-item">🐍 ${skill.language}</div>
                        <div class="meta-item">📄 ${skill.entrypoint}</div>
                    </div>
                    ${tags ? `<div class="tags">${tags}</div>` : ''}
                    <div class="path">📁 ${skill.path}</div>
                </div>
            `;
        }

        function createInstructionCard(instr) {
            const tags = instr.tags && instr.tags.length > 0 
                ? instr.tags.map(tag => `<span class="tag">${tag}</span>`).join('') 
                : '';
            
            return `
                <div class="card">
                    <div class="card-title">${instr.name}</div>
                    <div class="card-description">${instr.description}</div>
                    <div class="meta">
                        <div class="meta-item"><strong>v${instr.version}</strong></div>
                        <div class="meta-item">✍️ ${instr.author}</div>
                    </div>
                    ${tags ? `<div class="tags">${tags}</div>` : ''}
                    <div class="path">📁 ${instr.path}</div>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = '❌ Error: ' + message;
        }

        // Load on page load
        loadRepoContext();
    </script>
</body>
</html>
